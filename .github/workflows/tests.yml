name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: starter/package-lock.json

      - name: Install dependencies
        working-directory: starter
        run: npm install

      - name: Run tests
        working-directory: starter
        run: npm run test:run:verbose
